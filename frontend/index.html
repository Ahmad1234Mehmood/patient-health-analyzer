<!DOCTYPE html>
<html class="dark" lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Patient Health Data Analyzer</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      // apply saved theme before first paint (no flash)
      try { if (localStorage.getItem("theme") === "light") { document.documentElement.classList.remove("dark"); document.documentElement.classList.add("light"); } } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
